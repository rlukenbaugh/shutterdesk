<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src blob: mediastream:" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShutterDesk</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0b0e14;
      color: #f1f5f9;
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      background: #121721;
      border-right: 1px solid #1e293b;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .brand img { width: 32px; height: 32px; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    h2 { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .meta { font-size: 12px; color: #94a3b8; }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .sources > p { grid-column: 1 / -1; }
    .btn kbd { font: 11px Consolas, monospace; color: #94a3b8; }
    .btn.primary kbd, .btn.danger kbd { color: #dbeafe; }
    .btn:hover { background: #273549; }
    .btn:focus-visible, .source-card:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .btn:disabled { opacity: 0.55; cursor: progress; }
    .btn.primary { background: #2563eb; border-color: #2563eb; }
    .btn.primary:hover { background: #1d4ed8; }
    .btn.danger { background: #dc2626; border-color: #dc2626; }
    .btn.link { background: none; border: none; padding: 4px 0; color: #93c5fd; width: auto; }
    .warning {
      font-size: 12px;
      color: #fde68a;
      background: #422006;
      border: 1px solid #854d0e;
      border-radius: 6px;
      padding: 8px 10px;
    }
    main {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sources {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }
    .source-card {
      background: #121721;
      border: 2px solid #1e293b;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
    }
    .source-card:hover { border-color: #334155; }
    .source-card.selected { border-color: #3b82f6; }
    .source-card img, .source-card .blank { width: 100%; aspect-ratio: 16/9; object-fit: contain; border-radius: 4px; background: #020617; display: block; }
    .source-card span { display: block; margin-top: 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stage {
      flex: 1;
      min-height: 320px;
      background: #070a0f;
      border: 1px solid #1e293b;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    video, img.preview { max-width: 100%; max-height: 100%; object-fit: contain; }
    #status { font-family: Consolas, monospace; font-size: 12px; color: #94a3b8; word-break: break-all; }
    #status.error { color: #fca5a5; }
    .footer { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <img src="../assets/icon.png" alt="" />
      <div>
        <h1>ShutterDesk</h1>
        <p class="meta" id="version">Screenshot and screen recording</p>
      </div>
    </div>
    <button id="btnScreenshot" class="btn primary">Capture selected <kbd>Ctrl+Alt+Shift+S</kbd></button>
    <button id="btnRegion" class="btn">Capture a region <kbd>Ctrl+Alt+Shift+A</kbd></button>
    <button id="btnRecord" class="btn">Start recording <kbd>Ctrl+Alt+Shift+R</kbd></button>
    <button id="btnRefresh" class="btn">Refresh screens and windows</button>
    <button id="btnOpenFolder" class="btn">Open captures folder</button>
    <p id="hotkeyWarning" class="warning" hidden></p>
    <div class="footer">
      <p class="meta">Ctrl+Alt+Shift+S captures the screen under the mouse. The button captures the screen or window selected on the right.</p>
      <p id="status" role="status" aria-live="polite">Ready</p>
      <button id="btnShowFile" class="btn link" hidden>Show in folder</button>
    </div>
  </aside>
  <main>
    <h2>Screens</h2>
    <div class="sources" id="screensGrid"></div>
    <h2>Windows</h2>
    <div class="sources" id="windowsGrid"></div>
    <div class="stage" id="stage">
      <p class="meta">Select a screen or window above, then click Capture selected or Start recording.</p>
    </div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
