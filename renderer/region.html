<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:" />
  <title>ShutterDesk region</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    #shot { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; pointer-events: none; }
    #shade { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); pointer-events: none; }
    #box {
      position: fixed; display: none; pointer-events: none;
      border: 2px solid #3b82f6;
      /* Huge outline shadow darkens everything outside the selection. */
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.45);
    }
    #size {
      position: fixed; display: none; pointer-events: none;
      font: 12px "Segoe UI", system-ui, sans-serif; color: #fff;
      background: rgba(15, 23, 42, 0.85); padding: 2px 6px; border-radius: 4px;
    }
    #hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); pointer-events: none;
      font: 13px "Segoe UI", system-ui, sans-serif; color: #f1f5f9;
      background: rgba(15, 23, 42, 0.85); padding: 6px 12px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="shade"></div>
  <div id="box"></div>
  <div id="size"></div>
  <div id="hint">Drag to select an area. Esc or right-click cancels.</div>
  <script src="./region.js"></script>
</body>
</html>
